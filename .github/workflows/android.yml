name: Android

# The development sandbox cannot build this app at all: it has no Android SDK
# and dl.google.com — which is also where maven.google.com redirects — is
# unreachable from it, so neither the SDK nor a single AndroidX artifact can
# be fetched there. This job is therefore the compiler of record. Every change
# to android/ is proven here or not at all, and each run leaves an installable
# debug APK behind.
#
# No paths filter on the triggers, on purpose. Branch protection requires
# this workflow's `build` on every pull request, and a job that never starts
# never reports: with a filter, a backend-only pull request sat at "expected"
# forever and could not be merged (#6). So the workflow runs for every push
# and pull request and decides for itself, in seconds, whether anything under
# android/ changed; a `build` skipped for that reason reports "skipped",
# which satisfies the rule. A manual run always builds.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A pull request is compared against its base; a push to master against
      # what master was before it. When the comparison cannot be made (a first
      # push, a base that is not in the fetch), the answer is to build.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          decide() { echo "android=$1" >> "$GITHUB_OUTPUT"; echo "android changed: $1 ($2)"; }
          if [ "$EVENT" = "workflow_dispatch" ]; then decide true "manual run"; exit 0; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then decide true "no base to compare against"; exit 0; fi
          changed=$(git diff --name-only "$BASE" "$HEAD" -- android .github/workflows/android.yml)
          if [ -n "$changed" ]; then
            decide true "$(printf %s "$changed" | wc -l | tr -d ' ') file(s) under android/ or this workflow"
          else
            decide false "nothing under android/ in $BASE..$HEAD"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper jar is a binary in the repository. This proves it is one
      # Gradle actually published rather than something with a payload in it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK on this runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      # Both in one step, teed to a file. Kotlin prints its errors as `e:`
      # lines in the middle of several hundred lines of Gradle output, and
      # the environment this project is written in reads CI logs from the
      # tail; without this, finding out what actually broke costs several
      # round trips of guesswork.
      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon test assembleDebug 2>&1 | tee /tmp/gradle.log

      # Runs only when the build failed. Everything it finds is written to
      # the job summary as well as the log: GitHub appends its own post-job
      # steps after this one, so "last step" is not "end of the log", and a
      # summary is the only place that is genuinely easy to find.
      #
      # It greps three different things because a build fails in three
      # different phases and only one of them prints `e:` lines. A bad
      # version catalog, a missing plugin or an unresolvable dependency all
      # fail during configuration, where the message lives in Gradle's
      # "What went wrong" block and there is not one compiler error to find.
      - name: What broke
        if: failure()
        run: |
          summary() { tee -a "$GITHUB_STEP_SUMMARY"; }
          echo "## What broke" | summary
          echo '```' | summary
          echo "=== compiler errors ==="
          grep -E "^e: |^error: " /tmp/gradle.log | head -40 | summary || true
          echo "=== failing tests ==="
          grep -E "^[A-Za-z0-9_.]+ > .* FAILED$" /tmp/gradle.log | head -20 | summary || true
          echo "=== configuration / what went wrong ==="
          sed -n '/^\* What went wrong:/,/^\* Try:/p' /tmp/gradle.log | head -40 | summary || true
          if ! grep -qE "^e: |FAILED$|^\* What went wrong:" /tmp/gradle.log; then
            echo "=== nothing matched; tail of the build ==="
            tail -40 /tmp/gradle.log | summary
          fi
          echo '```' | summary

      # The release build, on every run. R8 shrinks and obfuscates only
      # here, and lint's fatal checks run only here, so a keep rule that is
      # missing or a resource that is broken shows up here rather than as a
      # crash on a phone that installed from Play. Signed with the upload key
      # when the four secrets are set, which is every run in this repository;
      # unsigned otherwise, which still proves the build. Play takes the
      # bundle. The APK is the same shrunk code signed the same way, for
      # putting a release build on a phone before Play is there to do it.
      # versionCode is the run number, which only ever grows (docs/PLAY.md).
      - name: Release bundle and APK
        env:
          ASR_VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ASR_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ASR_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ASR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            printf %s "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ASR_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
            echo "release: signed with the upload key, versionCode $ASR_VERSION_CODE"
          else
            echo "release: no upload key in this run, so unsigned; versionCode $ASR_VERSION_CODE"
          fi
          ./gradlew --no-daemon bundleRelease assembleRelease 2>&1 | tee -a /tmp/gradle.log
          ls -la app/build/outputs/bundle/release/ app/build/outputs/apk/release/
          if [ -n "${ASR_UPLOAD_KEYSTORE:-}" ]; then
            echo
            echo "upload key certificate (the key Play checks uploads against; also what a"
            echo "sideloaded release APK is signed with, so it belongs in ANDROID_CERT_SHA256"
            echo "next to Play's app signing certificate):"
            keytool -list -v -keystore "$ASR_UPLOAD_KEYSTORE" -storepass "$ASR_UPLOAD_KEYSTORE_PASSWORD" -alias "$ASR_UPLOAD_KEY_ALIAS" \
              | grep "SHA256:" | head -1
            rm -f "$ASR_UPLOAD_KEYSTORE"
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: asr-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: asr-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Push is the only channel this product has: the server queues a
      # notification per witness and the watchdog delivers it through FCM.
      # If google-services.json is missing or does not match the package
      # name, the app still builds and silently reaches nobody -- which is
      # the exact failure that went unnoticed for weeks. So the build says
      # out loud whether the ids the plugin generated are actually in the
      # APK, on every run.
      # Found rather than assumed: the google-services plugin has moved its
      # output directory between versions, and a check that hard-codes one
      # path fails for the wrong reason.
      - name: Firebase config in the APK
        if: success()
        run: |
          values=$(grep -rl "google_app_id" app/build/generated 2>/dev/null | head -1)
          if [ -z "$values" ]; then
            echo "::error::google-services did not run. Push will reach nobody."
            find app/build/generated -name "values*.xml" | head -20
            exit 1
          fi
          echo "from: $values"
          for key in google_app_id project_id gcm_defaultSenderId; do
            echo "$key: $(grep -o "\"$key\">[^<]*" "$values" | cut -d'>' -f2)"
          done

      # The fingerprint that has to be in /.well-known/assetlinks.json for a
      # joinasr.io/w/<code> link to open a debug build of this app rather
      # than a browser. It is a property of the key that signed the debug
      # APK, and that key is app/debug.keystore, committed and named in
      # build.gradle.kts, so the value never changes; it is printed here so
      # that it sits next to the upload key's, above, and the two go into
      # ANDROID_CERT_SHA256 together (comma-separated, with Play's app signing
      # certificate once there is one). Read with keytool, like the upload
      # key's, rather than parsed out of apksigner's report: the parse took
      # the wrong field and printed "CE:rt:iF:iC:At:ES:HA:-2:56:Di:gE:st". A
      # fingerprint is a public hash of a public certificate; there is
      # nothing here to keep quiet.
      - name: App Links fingerprint of the debug key
        if: success()
        run: |
          echo "debug signing certificate (app/debug.keystore; what a debug APK is signed with):"
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey \
            | grep "SHA256:" | head -1
          echo
          echo "Put this in the ANDROID_CERT_SHA256 repository secret (comma-separated with"
          echo "the upload key's, above, and the Play release fingerprint once there is one),"
          echo "then run Bootstrap."

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: asr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Deliberately the last step. The versions in gradle/libs.versions.toml
      # were pinned in an environment that cannot reach this list at all, so
      # they should be bumped from evidence rather than memory — and the only
      # way that evidence gets read is if it lands at the end of the log,
      # where the tail is.
      - name: Newest published Android Gradle Plugin
        if: always()
        run: |
          echo "pinned here: $(grep "^agp" gradle/libs.versions.toml)"
          echo "newest published:"
          curl -sSL --max-time 60 https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | grep -o "<version>[0-9][^<]*</version>" | tail -5
