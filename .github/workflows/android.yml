name: Android

# The development sandbox cannot build this app at all: it has no Android SDK
# and dl.google.com — which is also where maven.google.com redirects — is
# unreachable from it, so neither the SDK nor a single AndroidX artifact can
# be fetched there. This job is therefore the compiler of record. Every change
# to android/ is proven here or not at all, and each run leaves an installable
# debug APK behind.
on:
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper jar is a binary in the repository. This proves it is one
      # Gradle actually published rather than something with a payload in it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK on this runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      # Both in one step, teed to a file. Kotlin prints its errors as `e:`
      # lines in the middle of several hundred lines of Gradle output, and
      # the environment this project is written in reads CI logs from the
      # tail; without this, finding out what actually broke costs several
      # round trips of guesswork.
      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon test assembleDebug 2>&1 | tee /tmp/gradle.log

      # Runs only when the build failed, and last, so the errors are the
      # final thing in the log.
      - name: What broke
        if: failure()
        run: |
          echo "=== compiler errors ==="
          grep -E "^e: |^error: " /tmp/gradle.log | head -40 || true
          echo "=== failing tests ==="
          grep -E "^[A-Za-z0-9_.]+ > .* FAILED$" /tmp/gradle.log | head -20 || true
          echo "=== if both are empty, the tail of the build ==="
          if ! grep -qE "^e: |FAILED$" /tmp/gradle.log; then tail -40 /tmp/gradle.log; fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: asr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Deliberately the last step. The versions in gradle/libs.versions.toml
      # were pinned in an environment that cannot reach this list at all, so
      # they should be bumped from evidence rather than memory — and the only
      # way that evidence gets read is if it lands at the end of the log,
      # where the tail is.
      - name: Newest published Android Gradle Plugin
        if: always()
        run: |
          echo "pinned here: $(grep "^agp" gradle/libs.versions.toml)"
          echo "newest published:"
          curl -sSL --max-time 60 https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | grep -o "<version>[0-9][^<]*</version>" | tail -5
