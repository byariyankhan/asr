name: Bootstrap the VPS

# One-time (and safe to repeat) setup of /opt/asr on the production VPS.
# Run it by hand from the Actions tab; nothing triggers it automatically.
#
# Secrets it needs:
#   VPS_SSH_KEY                   private key whose public half is in the VPS's authorized_keys
#   VPS_HOST                      187.52.122.99
#   FIREBASE_SERVICE_ACCOUNT_JSON the whole Admin SDK JSON, pasted as-is
#   CERTBOT_EMAIL                 (optional) issues the TLS certificate unattended
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not set"; exit 1; }
          test -n "$VPS_HOST" || { echo "VPS_HOST is not set"; exit 1; }
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          while read -r type key rest; do
            case "$type" in ""|\#*) continue ;; esac
            printf "%s %s %s\n" "$VPS_HOST" "$type" "$key" >> ~/.ssh/known_hosts
          done < infra/vps-host-key.pub
          chmod 600 ~/.ssh/known_hosts
          printf "Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 root@"$VPS_HOST" true
          echo "host key matches the pinned one"

      # The repository is private, so the VPS is never given GitHub
      # credentials: the runner already has the checkout and ships it. The new
      # tree is unpacked beside the old one and swapped in, so a half-finished
      # transfer never becomes the live source.
      - name: Ship the source to /opt/asr/src
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # .git is excluded from the tarball, so the commit has to travel as
          # a file. /v1/health reports it and the deploy asserts against it.
          git rev-parse HEAD > .asr-commit
          tar czf /tmp/asr-src.tgz --exclude=.git --exclude=node_modules --exclude=.next .
          scp -i ~/.ssh/deploy_key /tmp/asr-src.tgz root@"$VPS_HOST":/tmp/asr-src.tgz
          ssh -i ~/.ssh/deploy_key root@"$VPS_HOST" bash -s <<'REMOTE'
          set -e
          rm -rf /opt/asr/src.new
          mkdir -p /opt/asr/src.new
          tar xzf /tmp/asr-src.tgz -C /opt/asr/src.new
          rm -f /tmp/asr-src.tgz
          rm -rf /opt/asr/src.old
          [ -d /opt/asr/src ] && mv /opt/asr/src /opt/asr/src.old
          mv /opt/asr/src.new /opt/asr/src
          echo "source in place: $(find /opt/asr/src -type f | wc -l) files"
          REMOTE

      # Written with `cat > file` from stdin so the key never appears in a
      # command line, where `ps` would show it.
      - name: Hand over the Firebase key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "FIREBASE_SERVICE_ACCOUNT_JSON is not set"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | ssh -i ~/.ssh/deploy_key root@"$VPS_HOST" \
            "umask 077 && cat > /root/asr-firebase-key.json && python3 -c \"import json;json.load(open('/root/asr-firebase-key.json'))\" && echo 'key received and parses as JSON'"

      - name: Run the setup script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@"$VPS_HOST" "CERTBOT_EMAIL='${CERTBOT_EMAIL}' bash /opt/asr/src/infra/first-time-setup.sh /root/asr-firebase-key.json"

      # first-time-setup.sh writes .env once and then never touches it again,
      # which is right — it must not be able to clobber live credentials. The
      # consequence is that a secret added after the first bootstrap (as
      # RESEND_API_KEY was) has no way in. This is that way: it edits the one
      # line and leaves the rest of the file byte for byte alone.
      #
      # Skipped entirely when the secret is unset, because empty is a working
      # state — the app logs emails instead of sending them.
      # first-time-setup.sh writes .env once and then never touches it again,
      # which is right -- it must not be able to clobber live credentials. The
      # consequence is that a secret added after the first bootstrap has no way
      # in. This is that way in: it rewrites exactly the named lines and leaves
      # the rest of the file byte for byte alone.
      #
      # One step for all of them rather than one per secret. The first version
      # of this handled RESEND_API_KEY alone and would have been copied four
      # times over for R2, which is four places for the shredding or the
      # verification to be forgotten in.
      #
      # A secret that is not set is skipped, not blanked: empty is a working
      # state everywhere here (email is logged instead of sent, photo uploads
      # answer 503), and a blank overwrite would silently switch a live
      # feature off.
      - name: Fill in the optional secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Built with python rather than shell string-building so a value
          # containing a quote cannot end up as shell syntax, and passed on
          # stdin so none of it appears in a command line where ps would show
          # it.
          payload=$(python3 - <<'PY'
          import json, os
          names = [
              "RESEND_API_KEY",
              "R2_ACCOUNT_ID",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET",
          ]
          print(json.dumps({n: os.environ[n] for n in names if os.environ.get(n)}))
          PY
          )
          count=$(printf %s "$payload" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          if [ "$count" = "0" ]; then
            echo "no optional secrets set; .env left alone"
            exit 0
          fi
          echo "$count secret(s) to write"

          printf %s "$payload" | ssh -i ~/.ssh/deploy_key root@"$VPS_HOST" \
            "umask 077 && cat > /root/.asr-secrets && echo received"

          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 root@"$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/asr
          python3 - <<'PY'
          import json, os, re, sys, tempfile
          values = json.load(open("/root/.asr-secrets"))
          # Compose reads .env as plain text. A value with a quote or a newline
          # in it would silently corrupt every variable after it, so anything
          # that is not a plain token is refused rather than written.
          for name, value in values.items():
              if not re.fullmatch(r"[A-Za-z0-9_.:/+=-]{1,500}", value):
                  sys.exit(f"{name} has characters that cannot go in .env; refusing")
          path = "/opt/asr/.env"
          lines = open(path).read().splitlines()
          out, seen = [], set()
          for line in lines:
              name = line.split("=", 1)[0] if "=" in line else None
              if name in values:
                  out.append(f"{name}={values[name]}")
                  seen.add(name)
              else:
                  out.append(line)
          for name, value in values.items():
              if name not in seen:
                  out.append(f"{name}={value}")
          fd, tmp = tempfile.mkstemp(dir="/opt/asr")
          os.write(fd, ("\n".join(out) + "\n").encode())
          os.close(fd)
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          print("set: " + ", ".join(f"{n} ({len(v)} chars)" for n, v in sorted(values.items())))
          PY
          shred -u /root/.asr-secrets 2>/dev/null || rm -f /root/.asr-secrets
          docker compose config -q
          # ASR_COMMIT is what /v1/health reports and what the deploy asserts
          # against. Restarting without it leaves the live answer saying
          # "commit": null, which reads as the deploy check being broken when
          # it is only this workflow having recreated the container.
          commit=$(cat /opt/asr/src/.asr-commit 2>/dev/null || true)
          ASR_COMMIT="$commit" docker compose up -d api --force-recreate
          # </dev/null or compose exec swallows the rest of this heredoc as its
          # own stdin. Prints lengths, never values.
          #
          # All four R2 variables, because the one that was wrong for days was
          # 65 characters where 32 was expected, and this loop was not printing
          # it. A length is not a secret and it is the whole check.
          for name in RESEND_API_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            n=$(docker compose exec -T api printenv "$name" </dev/null | tr -d "\n" | wc -c)
            echo "  container $name: $n characters"
          done
          healthy=""
          for _ in $(seq 1 10); do
            body=$(wget -qO- --content-on-error --timeout=5 http://127.0.0.1:3001/v1/health 2>/dev/null || true)
            case "$body" in *'"ok":true'*) healthy=yes; break ;; esac
            sleep 3
          done
          if [ -z "$healthy" ]; then
            echo "the API did not come back healthy after the restart"
            docker compose logs --tail=60 api || true
            exit 1
          fi
          echo "healthy after restart"
          # Whether photo uploads actually work, by doing one. Reported, never
          # fatal: R2 is optional and the API is fine without it. It says
          # writable, or it names which value is wrong — which is the answer
          # somebody wants while they are still looking at this log, not three
          # deploys later.
          echo "  storage: $(wget -qO- --content-on-error --timeout=10 http://127.0.0.1:3001/v1/health/storage 2>/dev/null || echo '<no answer>')"
          exit 0
          REMOTE

      # The key is in .env now; the loose copy has no reason to survive.
      - name: Remove the key file from the VPS
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key root@"$VPS_HOST" \
            "shred -u /root/asr-firebase-key.json /root/.asr-secrets 2>/dev/null || rm -f /root/asr-firebase-key.json /root/.asr-secrets; echo removed" || true

      # From the public internet this time, not from inside the box: this is
      # what the Android app will actually talk to.
      - name: Verify https://api.joinasr.io/v1/health
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 https://api.joinasr.io/v1/health 2>/dev/null || true)
            echo "attempt $i: ${body:-<no answer>}"
            if printf %s "$body" | grep -q "\"ok\":true"; then
              echo "api.joinasr.io is live over TLS"
              exit 0
            fi
            sleep 10
          done
          echo "No healthy answer over HTTPS. If everything else passed, TLS is the"
          echo "missing piece: ssh in and run  certbot --nginx -d api.joinasr.io"
          exit 1
