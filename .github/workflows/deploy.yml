name: Deploy to production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# Only deploys a commit CI has already passed. workflow_run fires for
# failures too, hence the conclusion check.
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      # The commit CI passed, not whatever master points at now: those differ
      # the moment two pushes land close together.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # No ssh-keyscan: a deploy has no business asking the network for a key
      # that does not change. The key is pinned in infra/vps-host-key.pub —
      # the same VPS Bookween deploys to, read from the host itself.
      #
      # If the VPS ever presents a different key this FAILS, and is neither
      # retried nor auto-accepted: a changed host key is either a rebuilt
      # server or someone in the middle, and both deserve a human.
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The pinned file holds key material only; the address comes from
          # the secret, and the two are joined here.
          : > ~/.ssh/known_hosts
          while read -r type key rest; do
            case "$type" in ""|\#*) continue ;; esac
            printf "%s %s %s\n" "$VPS_HOST" "$type" "$key" >> ~/.ssh/known_hosts
          done < infra/vps-host-key.pub
          chmod 600 ~/.ssh/known_hosts
          echo "pinned $(grep -c . ~/.ssh/known_hosts) host key(s) for the VPS"

          printf "Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 root@"$VPS_HOST" true 2>/tmp/ssh_err; then
            cat /tmp/ssh_err >&2
            if grep -qiE "HOST IDENTIFICATION HAS CHANGED|Host key verification failed" /tmp/ssh_err; then
              echo
              echo "The VPS is presenting a host key that is NOT the pinned one."
              echo "Refusing to continue, and refusing to accept the new key."
              echo "Verify it out of band before touching infra/vps-host-key.pub."
              exit 1
            fi
            echo "could not reach the VPS to pre-verify; the step that follows retries on its own"
          else
            echo "host key matches the pinned one"
          fi

      # The repository is private, so the VPS is never given GitHub
      # credentials: the runner already has the checkout and ships it. The new
      # tree is unpacked beside the old one and swapped in, so a half-finished
      # transfer never becomes the live source, and src.old is one `mv` away
      # if a build needs to be undone in a hurry.
      - name: Ship the source to /opt/asr/src
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          tar czf /tmp/asr-src.tgz --exclude=.git --exclude=node_modules --exclude=.next .
          scp -i ~/.ssh/deploy_key /tmp/asr-src.tgz root@"$VPS_HOST":/tmp/asr-src.tgz
          ssh -i ~/.ssh/deploy_key root@"$VPS_HOST" bash -s <<'REMOTE'
          set -e
          test -f /opt/asr/.env || { echo "No /opt/asr/.env — run the bootstrap workflow first."; exit 1; }
          rm -rf /opt/asr/src.new
          mkdir -p /opt/asr/src.new
          tar xzf /tmp/asr-src.tgz -C /opt/asr/src.new
          rm -f /tmp/asr-src.tgz
          rm -rf /opt/asr/src.old
          [ -d /opt/asr/src ] && mv /opt/asr/src /opt/asr/src.old
          mv /opt/asr/src.new /opt/asr/src
          cp /opt/asr/src/infra/docker-compose.yml /opt/asr/docker-compose.yml
          install -m 700 /opt/asr/src/infra/backup.sh /opt/asr/backup.sh
          REMOTE

      # api and migrate are built one at a time on purpose: they share a
      # Dockerfile (api goes through `builder` to reach `runner`, migrate IS
      # `builder`), so building them concurrently runs two full Next.js builds
      # side by side on a small VPS. Sequentially the second is a cache hit on
      # layers the first just produced.
      #
      # The pg_dump between build and migrate is the pre-migration safety net:
      # every deploy runs migrations, so every deploy first snapshots the
      # database it is about to migrate. Under `set -e` a failed dump aborts
      # the deploy BEFORE migrate touches anything — a deploy that cannot take
      # its safety backup should not be migrating.
      #
      # Image retention runs last, in a `set +e` block ending in `|| true`, and
      # only after the new container is up: housekeeping must never fail a
      # deploy or take the API down. The live image is tagged
      # asr-api:deploy-<sha>, the newest 3 kept, everything older removed along
      # with dangling images and build cache over a 5GB cap.
      #
      # Fast rollback to a kept release:
      #   docker tag asr-api:deploy-<sha> <the compose image tag>
      #   docker compose up -d api --force-recreate
      # A rollback does NOT undo migrations — restore a pre-deploy dump from
      # /opt/asr/backups if the schema changed.
      #
      # Retried as a whole: every step in it is safe to run again from
      # scratch, so a dropped connection cannot leave things half-done.
      - name: Build, migrate, restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          attempt=1
          delay=20
          while true; do
            if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
                 root@"$VPS_HOST" "SHA=$SHA bash -s" <<'REMOTE'; then
          set -e
          cd /opt/asr
          docker compose build api
          docker compose build migrate
          mkdir -p /opt/asr/backups
          docker compose exec -T postgres pg_dump -U asr -d asr -Fc </dev/null > "/opt/asr/backups/pre-deploy-$(date -u +%Y%m%d-%H%M%S).dump"
          ls -t /opt/asr/backups/pre-deploy-*.dump | tail -n +6 | xargs -r rm
          docker compose run --rm migrate
          docker compose up -d api --force-recreate
          {
            set +e
            cid=$(docker compose ps -q api)
            imgid=$(docker inspect -f "{{.Image}}" "$cid")
            docker tag "$imgid" "asr-api:deploy-${SHA:0:7}"
            echo "tagged this release as asr-api:deploy-${SHA:0:7}"
            docker images --format "{{.CreatedAt}}|{{.Repository}}:{{.Tag}}" \
              | grep "|asr-api:deploy-" | sort -r | tail -n +4 | cut -d"|" -f2 \
              | xargs -r -n1 docker rmi
            docker image prune -f
            docker builder prune -f --keep-storage 5GB || docker builder prune -f --max-used-space 5GB || docker builder prune -af
          } || true
          REMOTE
              break
            fi
            status=$?
            if [ "$attempt" -ge 4 ]; then
              echo "deploy failed after $attempt attempts (exit $status)"
              exit "$status"
            fi
            echo "attempt $attempt failed (exit $status); retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      # From the public internet, not from inside the box: this is the thing
      # the Android app actually talks to. /v1/health checks Postgres and
      # Redis, so a green here means the whole stack is serving.
      - name: Verify health
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 https://api.joinasr.io/v1/health 2>/dev/null || true)
            echo "health: ${body:-<no answer>}"
            if printf %s "$body" | grep -q "\"ok\":true"; then
              echo "healthy"
              exit 0
            fi
            sleep 5
          done
          echo "the API did not report healthy after the deploy"
          exit 1
