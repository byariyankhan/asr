# Local development: only the databases. The API runs with `pnpm dev`.
name: asr-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: asr
      POSTGRES_PASSWORD: asr
      POSTGRES_DB: asr
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass asr
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata:
