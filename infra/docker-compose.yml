# Production compose for the VPS. Version of record; the live copy is
# /opt/asr/docker-compose.yml (see docs/DEPLOYMENT.md). Build contexts are
# relative to /opt/asr, where src/ is the git checkout.
#
# Deliberately separate from /opt/bookween: own Postgres, own Redis, own
# volumes, own host ports (5433/6380/3001 vs Bookween's 5432/6379/3000).
# Moving this stack to another machine is a directory copy plus a pg_dump.
name: asr

# Every container's stdout is a json-file on the VPS's disk, and Docker's
# default keeps all of it forever. The API now writes a line per request,
# which is the point of it and also a disk that fills in a year. Five files
# of twenty megabytes each, per service, is weeks of history and a bounded
# amount of disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: asr
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: asr
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *logging
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      args:
        # Baked into the image (an ENV and a label). /v1/health reports it,
        # and the deploy refuses to pass until the live answer is the commit
        # it just shipped — the check that would have caught the API silently
        # not restarting for several releases. Being in the image rather than
        # set at `up -d` time, it also cannot drift from the image running.
        ASR_COMMIT: ${ASR_COMMIT:-}
    # `current` is a moving pointer, not a build artefact. The deploy builds
    # into it and keeps what it started as asr-api:deploy-<sha>; rollback.sh
    # re-points it at one of those and recreates the container. Either way a
    # plain `docker compose up -d` starts whichever release is current.
    image: asr-api:current
    restart: unless-stopped
    <<: *logging
    environment:
      DATABASE_URL: postgresql://asr:${PG_PASS}@postgres:5432/asr
      REDIS_URL: redis://:${REDIS_PASS}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      PLAY_PACKAGE_NAME: ${PLAY_PACKAGE_NAME}
      # The signing certificates /.well-known/assetlinks.json names, so a
      # joinasr.io/w/<code> link opens the app instead of a browser.
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      PLAY_SERVICE_ACCOUNT_JSON_B64: ${PLAY_SERVICE_ACCOUNT_JSON_B64}
      PLAY_PUBSUB_SECRET: ${PLAY_PUBSUB_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off: `docker compose run --rm migrate`
  migrate:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://asr:${PG_PASS}@postgres:5432/asr
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
